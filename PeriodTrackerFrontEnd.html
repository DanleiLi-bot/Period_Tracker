<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Period Tracker</title>

    <style>
        h1 {
            font-family: 'Indie Flower', cursive;
            color: rgb(111, 4, 58);
        }

        div.title {
            background-color: mistyrose;
            height: 150px;
            width: 300px;
            padding-left: 80px;
            padding-top: 50px;
            display: inline-block;
            border-radius: 20%;
            border: 2px solid rgb(111, 4, 58);
            position: fixed;
            left: 550px;
            top: 200px;
        }

        div.content {
            background-color: rgb(247, 231, 246);
            height: 100px;
            width: 300px;
            padding-left: 80px;
            padding-top: 30px;
            border-radius: 30%;
            border: 2px solid rgb(111, 4, 58);
            position: fixed;
            left: 550px;
            top: 450px;
        }
    </style>
</head>

<body>
    <div class="title">
        <h1>Period Tracker</h1>
    </div>

    <div class = "content">
        <h2 style="font-family: 'Indie Flower', cursive;
            color: rgb(111, 4, 58)">Track Your Period</h2>
    </div>
    
</body>
</html>
