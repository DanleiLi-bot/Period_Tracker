<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Period Tracker</title>

    <style>
        h1 {
            font-family: 'Indie Flower', cursive;
            color: rgb(111, 4, 58);
        }

        div.title {
            background-color: mistyrose;
            height: 150px;
            width: 300px;
            padding-left: 80px;
            padding-top: 50px;
            display: inline-block;
            border-radius: 20%;
            border: 2px solid rgb(111, 4, 58);
            position: fixed;
            left: 550px;
            top: 200px;
        }

        div.content {
            background-color: rgb(247, 231, 246);
            height: 120px;
            width: 300px;
            padding-left: 80px;
            padding-top: 30px;
            border-radius: 30%;
            border: 2px solid rgb(111, 4, 58);
            position: fixed;
            left: 550px;
            top: 450px;
        }

        .click {
            margin-top: -20px;
            margin-left: 60px
        }
    </style>
</head>

<body>
    <div class="title">
        <h1>Period Tracker</h1>
    </div>

    <div class = "content" id = "hereToStart">
        <h2 style="font-family: 'Indie Flower', cursive;
            color: rgb(111, 4, 58)">Track Your Period
        </h2>
        <h3 class = "click" style = "font-family: 'Indie Flower', cursive;
            color: rgb(111, 4, 58)">
                (Click me!)
        </h3>
    </div>

    <script>
        var content = document.getElementById("hereToStart");
        content.onclick = function() {
            alert("you have clicked the button");
        }

        class PeriodRecord {
            constructor(date, duration, cyclelength) {
                this.date = new Date(date);
                this.duration = duration;
                this.cyclelength = cyclelength;
            }

            getStartDate() {
                return this.date;
            }

            getDuration() {
                return this.duration;
            }

            getCycleLength() {
                return this.cyclelength;
            }
        }

        let records = [];

        class PeriodTracker {

            addRecord(record) {
                records.push(record);
            }

            periodPredictor() {
        
                if (records.length==0){ //returning null if there is no data
                    return null;
                }

                var currentLength = records.length;
                let lastOne = records[currentLength - 1];
                let lastDate = lastOne.getStartDate();
                let lastCycle = lastOne.getCycleLength();
                let lastDuration = lastOne.getDuration();
                let prediction = new Date(lastDate);
                prediction.setDate(prediction.getDate() + lastCycle + lastDuration); //Predicting using the last period record data

                 return prediction;
            }
        }
    </script>
    
</body>
</html>
