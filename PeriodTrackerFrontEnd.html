<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Period Tracker</title>

    <style>
        h1 {
            font-family: 'Indie Flower', cursive;
            color: rgb(111, 4, 58);
        }

        div.title {
            background-color: mistyrose;
            height: 100px;
            width: 600px;
            padding-left: 320px;
            padding-top: 10px;
            display: inline-block;
            border-radius: 20%;
            border: 2px solid rgb(111, 4, 58);
            position: fixed;
            left: 300px;
            top: 50px;
        }

        div.inputBox {
            background-color: rgb(252, 247, 247);
            height: 365px;
            width: 930px;
            border: 2px solid rgb(195, 8, 102);
            border-radius: 20%;
            position: fixed;
            left: 300px;
            top: 200px;
        }

        input.Date {
            position: fixed;
            left: 450px;
            top: 230px;
            width: 600px;
            height: 50px;
            border-radius: 10px;
            border: 1.5px solid rgb(195, 8, 102);
            padding-left: 10px;
        }

        input.Duration {
            position: fixed;
            left: 450px;
            top: 320px;
            width: 600px;
            height: 50px;
            border-radius: 10px;
            border: 1.5px solid rgb(195, 8, 102);
            padding-left: 10px;
        }

        input.CycleLength {
            position: fixed;
            left: 450px;
            top: 410px;
            width: 600px;
            height: 50px;
            border-radius: 10px;
            border: 1.5px solid rgb(195, 8, 102);
            padding-left: 10px;
        }

        button.Button {
            position: fixed;
            left: 590px;
            top: 490px;
            width: 300px;
            height: 45px;
            border-radius: 10px;
            border: 1.5px solid rgb(195, 8, 102);
            font-size: 18px;
            background-color: white;
            color: rgb(111, 4, 58);
            font-family: 'Indie Flower', cursive;
            color: rgb(111, 4, 58);
        }

        div.outputBox {
            background-color: rgb(252, 247, 247);
            height: 80px;
            width: 700px;
            border: 2px solid rgb(195, 8, 102);
            border-radius: 20%;
            position: fixed;
            left: 420px;
            top: 600px;
        }
    </style>
</head>

<body>
    <div class="title">
        <h1>Period Tracker</h1>
    </div>

    <div class="inputBox">
    </div>

    <input class="Date" placeholder="Enter the start date of your period (YYYY-MM-DD)" id="dateInput"
        onchange="updateDate()">
    <input class="Duration" placeholder="Enter the duration of your period (in days)" id="durationInput"
        onchange="updateDuration()">
    <input class="CycleLength" placeholder="Enter the length of your menstrual cycle (in days)" id="cycleLengthInput"
        onchange="updateCycleLength()">
    <button class="Button" onclick="calculatePrediction()">
        Predict Next Period
    </button>

    <div class="outputBox">
    </div>

    <input type="text" id="predictionOutput" placeholder="Your next period is predicted to start on: " style="position: fixed; left:
     450px; top: 600px; width: 600px; height: 50px; border-radius: 10px; border: 1.5px solid rgb(195, 8, 102);
      padding-left: 10px; margin: 15px;" readonly>
    <script>

        class PeriodRecord {
            constructor(date, duration, cyclelength) {
                this.date = new Date(date);
                this.duration = Number(duration);
                this.cyclelength = Number(cyclelength);
            }

            getStartDate() {
                return this.date;
            }

            getDuration() {
                return this.duration;
            }

            getCycleLength() {
                return this.cyclelength;
            }
        }

        let records = [];

        class PeriodTracker {

            addRecord(record) {
                records.push(record);
            }

            periodPredictor() {

                if (records.length == 0) { //returning null if there is no data
                    return null;
                }

                var currentLength = records.length;
                let lastOne = records[currentLength - 1];
                let lastDate = lastOne.getStartDate();
                let lastCycle = lastOne.getCycleLength();
                let lastDuration = lastOne.getDuration();
                let prediction = new Date(lastDate);
                prediction.setDate(prediction.getDate() + lastCycle); //Predicting using the last period record data

                return prediction;
            }
        }

        var currentDate;
        var currentDuration;
        var currentCycleLength;

        function updateDate() {
            currentDate = document.getElementById("dateInput").value;
        }

        function updateDuration() {
            currentDuration = document.getElementById("durationInput").value;
        }

        function updateCycleLength() {
            currentCycleLength = document.getElementById("cycleLengthInput").value;
        }

        function calculatePrediction() {
            var newRecord = new PeriodRecord(currentDate, currentDuration, currentCycleLength);
            var tracker = new PeriodTracker();
            tracker.addRecord(newRecord);
            var prediction = tracker.periodPredictor();

            if (prediction == null) {
                document.getElementById("predictionOutput").value = "Please enter your period data to get a prediction.";
            } else {
                let modifiedPrediction = prediction.getFullYear() + "-" + (prediction.getMonth() + 1).toString().padStart(2, '0') + "-" + prediction.getDate().toString().padStart(2, '0');
                document.getElementById("predictionOutput").value = "Your next period is predicted to start on: " + modifiedPrediction;
            }
        }
    </script>

</body>

</html>
